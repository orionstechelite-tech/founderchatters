services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: founderchatters
      POSTGRES_PASSWORD: founderchatters
      POSTGRES_DB: founderchatters
    ports:
      - "5432:5432"
    volumes:
      - fc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderchatters -d founderchatters"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fc_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fc_postgres:
  fc_redis:
